services:
  - type: web
    name: sculpt-resume-tailor
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: off
    envVars:
      - key: SOCLAAS_BASE_URL
        value: https://soclaas-api.comp.nus.edu.sg/v1
      - key: SOCLAAS_MODEL
        value: qwen3.6:35b
      - key: SOCLAAS_TIMEOUT_SECONDS
        value: "300"
      - key: SOCLAAS_API_KEY
        sync: false
      - key: RESUME_ACCESS_USERNAME
        value: resume
      - key: RESUME_ACCESS_PASSWORD
        sync: false
